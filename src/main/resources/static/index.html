<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<title>ControlaPET</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
    <div class="statusbar">
        <span>12:30</span>
        <span>&#x2026; &#x1F6DC; &#x1F50B; </span>
    </div>

    <div class="app-header">
        <div class="icon-btn" title="Início">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5Z"/></svg>
        </div>
        <h1 id="header-title">Ler</h1>
        <div class="icon-btn" title="Perfil">
            <img src="img/logoPET.png" alt="Logo do PET-SI" class="LogoPET">
        </div>
    </div>

    <div class="content" id="content"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-title">Item</div>
      <div class="modal-sub" id="modal-sub">Status</div>
      <div class="modal-actions">
        <div class="modal-btn primary">Emprestar</div>
        <div class="modal-btn">Devolver</div>
        <div class="modal-btn danger">Relatar defeito</div>
      </div>
      <div class="modal-close" id="modal-close">Fechar</div>
    </div>
  </div>

  <!-- Modal Adicionar/Editar Item -->
  <div class="modal-overlay" id="edit-modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="edit-modal-title">Novo item</div>
      <div class="modal-sub">Preencha os dados do item</div>

      <div class="form-group">
        <label for="edit-emoji">Emoji</label>
        <input type="text" id="edit-emoji" placeholder="📦" maxlength="2">
      </div>
      <div class="form-group">
        <label for="edit-name">Nome do item</label>
        <input type="text" id="edit-name" placeholder="Ex: Cabo USB-C">
      </div>
      <div class="form-group">
        <label for="edit-qty">Quantidade</label>
        <input type="number" id="edit-qty" placeholder="Ex: 5" min="0">
      </div>
      <div class="form-group">
        <label for="edit-status">Status / observação</label>
        <input type="text" id="edit-status" placeholder="Ex: Disponível no armário PET">
      </div>

      <div class="modal-actions">
        <div class="modal-btn primary" id="edit-save">Salvar</div>
        <div class="modal-btn danger" id="edit-delete">Excluir item</div>
      </div>
      <div class="modal-close" id="edit-modal-close">Cancelar</div>
    </div>
  </div>

  <!-- Modal Pesquisa Auditoria -->
  <div class="modal-overlay" id="audit-search-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Pesquisar auditoria</div>
      <div class="modal-sub">Filtre por data e/ou por quem realizou a ação</div>

      <div class="form-group">
        <label for="audit-search-date">Data</label>
        <input type="date" id="audit-search-date">
      </div>
      <div class="form-group">
        <label for="audit-search-name">Nome</label>
        <input type="text" id="audit-search-name" placeholder="Ex: Thiago">
      </div>

      <div class="modal-actions">
        <div class="modal-btn primary" id="audit-search-apply">Buscar</div>
        <div class="modal-btn" id="audit-search-clear">Limpar filtro</div>
      </div>
      <div class="modal-close" id="audit-search-close">Cancelar</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" data-tab="catalogo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
      <span>Catálogo</span>
    </div>
    <div class="nav-scan" data-tab="scanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4a1 1 0 0 1 1-1h3M17 3h3a1 1 0 0 1 1 1v3M21 17v3a1 1 0 0 1-1 1h-3M7 21H4a1 1 0 0 1-1-1v-3"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
    </div>
    <div class="nav-item" data-tab="auditoria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M11 10v8M15 13v5M19 7v11"/></svg>
      <span>Auditoria</span>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
