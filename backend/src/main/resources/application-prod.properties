# Producao exige variaveis explicitas; nao usa credenciais locais como alternativa.
spring.datasource.url=${DB_URL_CONTROLAPET:}
spring.datasource.username=${DB_USER_CONTROLAPET:}
spring.datasource.password=${DB_PASSWORD_CONTROLAPET:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
api.security.token.secret=${JWT_SECRET_CONTROLAPET:}
app.frontend-url=${FRONTEND_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
spring.mail.host=${MAIL_HOST:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
