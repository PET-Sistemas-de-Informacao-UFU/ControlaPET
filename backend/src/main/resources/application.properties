spring.application.name=controlapet

# Carrega o arquivo .env da raiz do projeto (opcional: nao quebra se ausente)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.jackson.time-zone=America/Sao_Paulo
tools.jackson.databind.SerializationFeature.WRITE_DATES_AS_TIMESTAMPS=false

# Sem .env e sem variaveis de ambiente, cai no Postgres local do docker-compose
spring.datasource.url=${DB_URL_CONTROLAPET:jdbc:postgresql://localhost:5432/inventario_pet}
spring.datasource.username=${DB_USER_CONTROLAPET:postgres}
spring.datasource.password=${DB_PASSWORD_CONTROLAPET:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.rate-limit.email-max=${PASSWORD_RESET_EMAIL_MAX:3}
app.password-reset.rate-limit.ip-max=${PASSWORD_RESET_IP_MAX:10}
app.password-reset.rate-limit.window-minutes=${PASSWORD_RESET_WINDOW_MINUTES:15}

api.security.token.secret=${JWT_SECRET_CONTROLAPET:Y2hhdmUtcGFkcmFvLWxvY2FsLXBldC1pbnZlbnRhcmlvLWRldg==}
api.security.token.expiration=${JWT_EXPIRATION_CONTROLAPET:900000}
api.security.token.refresh.expiration=${JWT_REFRESH_EXPIRATION_CONTROLAPET:604800000}

server.port=${PORT:8080}
